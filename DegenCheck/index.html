<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DegenCheck // Cybernetic Wallet Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>

  <header>
    <nav class="container">
      <div class="logo"><a href="../index.html">Degen Pets</a></div>
    </nav>
  </header>

  <main>
    <section class="hero-section">
      <div class="container">
        <h1 class="glitch" data-text="[DEGEN_CHECK]"><span>[DEGEN_CHECK]</span></h1>
        <p class="subtitle">// Connect your wallet to analyze your ApeChain journey //</p>

        <div class="cta-buttons">
          <button id="connectBtn" class="button button-primary">[Connect_Wallet]</button>
        </div>

        <div id="walletOutput" class="output-box"></div>

        <!-- NEW: Pet Section -->
        <div id="petSection" class="pet-section hidden">
          <img id="petImage" src="" alt="Assigned Pet" />
          <div id="petText" class="pet-text"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer">
    <div class="container">
      <div class="footer-links">
        <a href="../index.html">[Degen Pets]</a>
      </div>
      <p>© <span id="year"></span> Degen Pets // Cybernetic Systems Online.</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
