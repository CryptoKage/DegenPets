<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DegenCheck // Cybernetic Wallet Scanner</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Web3Modal Styles (Add this) -->
  <!-- You might need to host this locally or use a different CDN -->
  <!-- Check Web3Modal documentation for latest CDN/setup -->
  <!-- Example using unpkg - verify the correct package/version -->
  <script src="https://unpkg.com/@web3modal/ethers5@3.1.0/dist/ethers5.js"></script>
  <!-- Note: Finding a direct CSS CDN for Web3Modal v3+ can be tricky. -->
  <!-- Often it's bundled. Check their latest docs. -->
  <!-- Placeholder CSS link - Adjust as needed -->
  <!-- <link rel="stylesheet" href="https://path/to/web3modal.css"> -->

  <!-- Load ethers.js (Web3Modal might bundle this, check compatibility) -->
  <!-- Keep it for now, but verify if Web3Modal's bundle suffices -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <!-- Load html2canvas for screenshots -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Gold Rain Canvas -->
  <canvas id="goldRainCanvas" class="hidden"></canvas>

  <header>
    <nav class="container">
      <div class="logo"><a href="../index.html">Degen Pets</a></div>
    </nav>
  </header>

  <main>
    <section class="hero-section">
      <div class="container">
        <h1 class="glitch" data-text="[DEGEN_CHECK]"><span>[DEGEN_CHECK]</span></h1>
        <p class="subtitle">// Connect your wallet to initiate scan //</p>

        <div class="cta-buttons">
          <!-- Buttons now control the Web3Modal -->
          <button id="connectBtn" class="button button-primary">[Connect Wallet]</button>
          <button id="disconnectBtn" class="button button-secondary hidden">[Disconnect Wallet]</button>
        </div>

        <div id="walletOutput" class="output-box"></div>

        <div id="resultArea" class="result-area hidden">
          <!-- Score Breakdown -->
          <div id="scoreBreakdown" class="score-breakdown">
            <h3>Score Breakdown</h3>
            <ul id="scoreList"></ul>
            <div id="mintPass" class="mint-pass"></div>
            <div id="bonusButtons" class="bonus-buttons hidden">
              <a id="mintButton" class="button button-primary" href="#" target="_blank">[Join Waitlist]</a>
              <a id="docsButton" class="button button-secondary" href="https://degen-pets-1.gitbook.io/degen-pets/" target="_blank">[Read Game Docs]</a>
              <button id="shareScoreBtn" class="button button-secondary">[Share Score]</button>
            </div>
          </div>

          <!-- Pet Section -->
          <div id="petSection" class="pet-section hidden">
            <img id="petImage" src="" alt="Assigned Pet" />
            <div id="petText" class="pet-text"></div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer id="footer">
    <div class="container">
      <div class="footer-links">
        <a href="../index.html">[Degen Pets]</a>
      </div>
      <p>© <span id="year"></span> Degen Pets // Cybernetic Systems Online.</p>
    </div>
  </footer>

  <!-- Make sure script.js is loaded as a module for Web3Modal imports -->
  <script type="module" src="script.js" defer></script>
</body>
</html>
